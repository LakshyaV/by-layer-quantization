[project]
name = "fragmap"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "gguf>=0.19.0",
    "huggingface-hub[cli]>=1.29.0",
    "matplotlib>=3.11.1",
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "typer>=0.27.2",
]

[project.scripts]
fragmap = "fragmap:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
